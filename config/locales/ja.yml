ja:
  time:
    formats:
      default: "%Y/%m/%d %H:%M:%S"
      short: "%Y/%m/%d %H:%M"
      long: "%Y年%m月%d日 %H時%M分%S秒"
  date:
    formats:
      default: "%Y/%m/%d"
      short: "%m/%d"
      long: "%Y年%m月%d日"
  datetime:
    distance_in_words:
      half_a_minute: "30秒"
      less_than_x_seconds:
        one: "1秒以内"
        other: "%{count}秒以内"
      x_seconds:
        one: "1秒"
        other: "%{count}秒"
      less_than_x_minutes:
        one: "1分以内"
        other: "%{count}分以内"
      x_minutes:
        one: "1分"
        other: "%{count}分"
      about_x_hours:
        one: "約1時間"
        other: "約%{count}時間"
      x_days:
        one: "1日"
        other: "%{count}日"
      about_x_months:
        one: "約1ヶ月"
        other: "約%{count}ヶ月"
      x_months:
        one: "1ヶ月"
        other: "%{count}ヶ月"
      about_x_years:
        one: "約1年"
        other: "約%{count}年"
      over_x_years:
        one: "1年以上"
        other: "%{count}年以上"
      almost_x_years:
        one: "1年近く"
        other: "%{count}年近く"
