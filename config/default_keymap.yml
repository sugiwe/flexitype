# デフォルトキーマップ（QWERTY配列ベース）
# ログアウト状態またはキーマップ未設定のユーザーが使用する

# Layer 0: 基本レイヤー（通常時|Shift時の2段表示）
layer_0:
  # 左手側
  # 1行目
  0-0: "tab"
  0-1: "Q|q"
  0-2: "W|w"
  0-3: "E|e"
  0-4: "R|r"
  0-5: "T|t"
  # 2行目
  1-0: "caps"
  1-1: "A|a"
  1-2: "S|s"
  1-3: "D|d"
  1-4: "F|f"
  1-5: "G|g"
  # 3行目
  2-0: "shift"
  2-1: "Z|z"
  2-2: "X|x"
  2-3: "C|c"
  2-4: "V|v"
  2-5: "B|b"
  # 4行目（最下段）
  3-0: "ctrl"
  3-1: "alt"
  3-2: "cmd"
  3-3: "layer1" # Layer 1切り替え
  3-4: "lower" # Lower
  3-5: "spc"

  # 右手側
  # 1行目
  6-0: "Y|y"
  6-1: "U|u"
  6-2: "I|i"
  6-3: "O|o"
  6-4: "P|p"
  6-5: "bs"
  # 2行目
  7-0: "H|h"
  7-1: "J|j"
  7-2: "K|k"
  7-3: "L|l"
  7-4: "_|-"
  7-5: "ent"
  # 3行目
  8-0: "N|n"
  8-1: "M|m"
  8-2: "<|,"
  8-3: ">|."
  8-4: "↑"
  8-5: "?|/"
  # 4行目（最下段）
  9-0: "spc"
  9-1: "raise"
  9-2: "layer2"
  9-3: "←"
  9-4: "↓"
  9-5: "→"

# Layer 1: 記号・数字レイヤー（2段表示対応）
layer_1:
  # 左手側
  # 1行目
  0-0: "tab"
  0-1: "!|1"
  0-2: "@|2"
  0-3: "#|3"
  0-4: "$|4"
  0-5: "%|5"
  # 2行目（caps以外は未設定）
  1-0: "caps"
  1-1: ""
  1-2: ""
  1-3: ""
  1-4: ""
  1-5: ""
  # 3行目（shift以外は未設定）
  2-0: "shift"
  2-1: ""
  2-2: ""
  2-3: ""
  2-4: ""
  2-5: ""
  # 4行目（特殊キーはそのまま）
  3-0: "ctrl"
  3-1: "alt"
  3-2: "cmd"
  3-3: "layer1"
  3-4: "lower"
  3-5: "spc"

  # 右手側
  # 1行目
  6-0: "^|6"
  6-1: "&|7"
  6-2: "*|8"
  6-3: "(|9"
  6-4: ")|0"
  6-5: "bs"
  # 2行目（ent以外は未設定）
  7-0: ""
  7-1: ""
  7-2: ""
  7-3: ""
  7-4: ""
  7-5: "ent"
  # 3行目（矢印・記号は未設定）
  8-0: ""
  8-1: ""
  8-2: ""
  8-3: ""
  8-4: ""
  8-5: ""
  # 4行目（特殊キー・矢印はそのまま）
  9-0: "spc"
  9-1: "raise"
  9-2: "layer2"
  9-3: ""
  9-4: ""
  9-5: ""

