# デフォルトキーマップ（QWERTY配列ベース）
# ログアウト状態またはキーマップ未設定のユーザーが使用する

# Layer 0: 基本レイヤー（通常時|Shift時の2段表示）
layer_0:
  # 左手側
  # 1行目
  L0-R0: "tab"
  L0-R1: "Q|q"
  L0-R2: "W|w"
  L0-R3: "E|e"
  L0-R4: "R|r"
  L0-R5: "T|t"
  # 2行目
  L1-R0: "caps"
  L1-R1: "A|a"
  L1-R2: "S|s"
  L1-R3: "D|d"
  L1-R4: "F|f"
  L1-R5: "G|g"
  # 3行目
  L2-R0: "shift"
  L2-R1: "Z|z"
  L2-R2: "X|x"
  L2-R3: "C|c"
  L2-R4: "V|v"
  L2-R5: "B|b"
  # 4行目（最下段）
  L3-R0: "ctrl"
  L3-R1: "alt"
  L3-R2: "cmd"
  L3-R3: "layer1"   # Layer 1切り替え
  L3-R4: "lower"    # Lower
  L3-R5: "spc"

  # 右手側
  # 1行目
  R0-R0: "Y|y"
  R0-R1: "U|u"
  R0-R2: "I|i"
  R0-R3: "O|o"
  R0-R4: "P|p"
  R0-R5: "bs"
  # 2行目
  R1-R0: "H|h"
  R1-R1: "J|j"
  R1-R2: "K|k"
  R1-R3: "L|l"
  R1-R4: "_|-"
  R1-R5: "ent"
  # 3行目
  R2-R0: "N|n"
  R2-R1: "M|m"
  R2-R2: "<|,"
  R2-R3: ">|."
  R2-R4: "↑"
  R2-R5: "?|/"
  # 4行目（最下段）
  R3-R0: "spc"
  R3-R1: "raise"
  R3-R2: "layer2"
  R3-R3: "←"
  R3-R4: "↓"
  R3-R5: "→"

# Layer 1: 記号・数字レイヤー（2段表示対応）
layer_1:
  # 左手側
  # 1行目
  L0-R0: "tab"
  L0-R1: "!|1"
  L0-R2: "@|2"
  L0-R3: "#|3"
  L0-R4: "$|4"
  L0-R5: "%|5"
  # 2行目
  L1-R0: "caps"
  L1-R1: "!|1"
  L1-R2: "@|2"
  L1-R3: "#|3"
  L1-R4: "$|4"
  L1-R5: "%|5"
  # 3行目
  L2-R0: "shift"
  L2-R1: "{|("
  L2-R2: "}|)"
  L2-R3: "[|["
  L2-R4: "]|]"
  L2-R5: "{|{"
  # 4行目
  L3-R0: "ctrl"
  L3-R1: "alt"
  L3-R2: "cmd"
  L3-R3: "layer1"
  L3-R4: "lower"
  L3-R5: "spc"

  # 右手側
  # 1行目
  R0-R0: "^|6"
  R0-R1: "&|7"
  R0-R2: "*|8"
  R0-R3: "(|9"
  R0-R4: ")|0"
  R0-R5: "bs"
  # 2行目
  R1-R0: "^|6"
  R1-R1: "&|7"
  R1-R2: "*|8"
  R1-R3: "(|9"
  R1-R4: ")|0"
  R1-R5: "ent"
  # 3行目
  R2-R0: "}|}"
  R2-R1: "+|="
  R2-R2: "+|+"
  R2-R3: "_|_"
  R2-R4: "↑"
  R2-R5: "||\\"
  # 4行目
  R3-R0: "spc"
  R3-R1: "raise"
  R3-R2: "layer2"
  R3-R3: "←"
  R3-R4: "↓"
  R3-R5: "→"

# Layer 2以降は必要に応じて追加
